name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the floor: type stripping runs unflagged from 22.18, and
        # `node:sqlite` (used by the real-database suite) from 22.13.
        node: ["22.18", "22", "24"]
        os: [ubuntu-latest]
        include:
          - node: "24"
            os: macos-latest
          - node: "24"
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  dependencies:
    name: No dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # A test-time tool that drags in a dependency tree is a tool people
      # decline to add. Enforced rather than asserted in a README.
      - name: Assert the dependency tree is empty
        run: |
          node -e "
            const pkg = require('./package.json');
            const runtime = { ...pkg.dependencies, ...pkg.peerDependencies };
            if (Object.keys(runtime).length) {
              console.error('Runtime dependencies found:', runtime); process.exit(1);
            }
            const dev = Object.keys(pkg.devDependencies ?? {});
            if (dev.length !== 1 || dev[0] !== 'typescript') {
              console.error('Unexpected devDependencies:', dev); process.exit(1);
            }
            console.log('Zero runtime dependencies, one devDependency: typescript');
          "
      - run: npm audit --audit-level=low
